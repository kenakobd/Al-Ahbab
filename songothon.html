<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#7c6cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="আল আহবাব">
<meta name="mobile-web-app-capable" content="yes">
<title>আল আহবাব সংগঠন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --t1:#7c6cf0; --t2:#f06ca0; --bg1:#eef0ff; --bg2:#ffe9f5; --bg3:#e8f7ff;
    --card:rgba(255,255,255,.55); --card-b:rgba(255,255,255,.75); --text:#2c2a4a; --sub:#6b6887;
  }
  [data-theme="mint"]{ --t1:#2bb787; --t2:#5bd6c0; --bg1:#e7fbf3; --bg2:#eafff6; --bg3:#e3f9ff; --text:#163b32; --sub:#4f7d71; }
  [data-theme="sunset"]{ --t1:#ff8a5c; --t2:#ff5c8a; --bg1:#fff1e6; --bg2:#ffe8ee; --bg3:#fff6e0; --text:#4a2a1f; --sub:#9a6a52; }
  [data-theme="ocean"]{ --t1:#2f9ce0; --t2:#36d2c9; --bg1:#e6f6ff; --bg2:#e3fbf8; --bg3:#eef7ff; --text:#0f3a4d; --sub:#4d7f93; }
  [data-theme="lav"]{ --t1:#a06cf0; --t2:#f06cd8; --bg1:#f3ecff; --bg2:#fdecff; --bg3:#eef0ff; --text:#3a2a4a; --sub:#7d6a93; }
  html,body{ height:100%; }
  body{
    font-family:'Hind Siliguri',system-ui,sans-serif; color:var(--text);
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    min-height:100%; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  .glass{ background:var(--card); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--card-b); border-radius:22px; box-shadow:0 8px 30px rgba(60,50,100,.10); }
  .grad-text{ background:linear-gradient(90deg,var(--t1),var(--t2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .btn{ background:linear-gradient(90deg,var(--t1),var(--t2)); color:#fff; border-radius:16px; font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,.12); }
  .btn:active{ transform:scale(.97); }
  .tab-btn.active{ background:var(--card-b); color:var(--text); }
  .tab-btn{ color:var(--sub); }
  input,select{ background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.8); border-radius:14px; padding:10px 14px; color:var(--text); width:100%; }
  ::-webkit-scrollbar{ display:none; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body data-theme="default">
<div id="app" class="max-w-md mx-auto px-4 pt-6 pb-28"></div>

<script>
const THEMES=[["default","বেগুনি আভা"],["mint","পুদিনা"],["sunset","সূর্যাস্ত"],["ocean","সমুদ্র"],["lav","ল্যাভেন্ডার"]];
const ADMIN_EMAIL="alahbab.songothon@gmail.com";
const firebaseConfig={apiKey:"AIzaSyCXhmil4mNwmsjA0-Ok2jpZF0RdwrpjxQg",authDomain:"al-ahbab-songothon.firebaseapp.com",projectId:"al-ahbab-songothon",storageBucket:"al-ahbab-songothon.firebasestorage.app",messagingSenderId:"181335280275",appId:"1:181335280275:web:7316d0d91fd9aa91169b66"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();
let members=[],savings=[],loans=[],config={orgName:"আল আহবাব সংগঠন",monthlyAmount:1000,termMonths:12};
let tab="dash",isAdmin=false,taps=0,loanMode='member',selectedMemberId=null,themeMenuOpen=false,memberChartInstance=null;

function fmt(n){ return (Number(n)||0).toLocaleString('bn-BD'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStr(){ return new Date().toISOString().slice(0,7); }
function memberName(id){ const m=members.find(x=>x.id===id); return m?m.name:'অজানা সদস্য'; }
function memberSaved(id){ return savings.filter(s=>s.memberId===id).reduce((a,s)=>a+Number(s.amount||0),0); }

function setTheme(t){
  document.body.setAttribute('data-theme', t==='default'?'':t);
  try{ localStorage.setItem('org_theme', t); }catch(e){}
}
try{ const saved=localStorage.getItem('org_theme'); if(saved) setTheme(saved); }catch(e){}

function switchTab(t){ tab=t; taps=0; render(); }
function tapLogo(){
  taps++;
  if(taps>=7){ taps=0; openAdminGate(); }
  clearTimeout(window._tapTimer);
  window._tapTimer=setTimeout(()=>taps=0,1500);
}

function openAdminGate(){
  if(isAdmin){ switchTab('settings'); return; }
  const wrap=document.createElement('div');
  wrap.className='fixed inset-0 z-50 flex items-center justify-center bg-black/30 px-6';
  wrap.innerHTML=`<div class="glass w-full max-w-xs p-6 text-center">
    <div class="text-lg font-semibold mb-3">অ্যাডমিন প্রবেশ</div>
    <input id="pw" type="password" placeholder="পাসওয়ার্ড" class="mb-3">
    <div class="flex gap-2">
      <button id="pwCancel" class="flex-1 py-2 rounded-xl" style="background:rgba(255,255,255,.6)">বাতিল</button>
      <button id="pwOk" class="btn flex-1 py-2">প্রবেশ</button>
    </div>
    <div id="pwErr" class="text-red-500 text-sm mt-2 hidden">পাসওয়ার্ড ভুল হয়েছে</div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#pwCancel').onclick=()=>wrap.remove();
  wrap.querySelector('#pwOk').onclick=async()=>{
    const v=wrap.querySelector('#pw').value;
    try{
      await auth.signInWithEmailAndPassword(ADMIN_EMAIL, v);
      isAdmin=true; wrap.remove(); switchTab('settings');
    }catch(e){ wrap.querySelector('#pwErr').classList.remove('hidden'); }
  };
}

function topBar(title){
  return `<div class="text-center mb-2">
    <div class="text-sm" style="color:var(--sub)">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <div class="text-xs" style="color:var(--sub)">বিসমিল্লাহির রহমানির রহিম</div>
  </div>
  <div class="relative flex items-center justify-between mb-5 pt-1">
    <div onclick="tapLogo()" class="select-none">
      <div class="text-xs" style="color:var(--sub)">স্বাগতম</div>
      <div class="text-xl font-bold grad-text">${config.orgName}</div>
    </div>
    <button onclick="themeMenuOpen=!themeMenuOpen;render()" class="w-9 h-9 rounded-full glass flex items-center justify-center text-xl font-bold" style="line-height:1">⋮</button>
    ${themeMenuOpen?`<div class="glass absolute right-0 top-12 p-3 z-40 flex gap-2">${THEMES.map(([k])=>`<button onclick="setTheme('${k}');themeMenuOpen=false;render()" class="w-7 h-7 rounded-full border-2 border-white/70" style="background:linear-gradient(135deg, ${k==='default'?'#7c6cf0,#f06ca0':k==='mint'?'#2bb787,#5bd6c0':k==='sunset'?'#ff8a5c,#ff5c8a':k==='ocean'?'#2f9ce0,#36d2c9':'#a06cf0,#f06cd8'})"></button>`).join('')}</div>`:''}
  </div>`;
}

function navBar(){
  const items=[["dash","হোম"],["members","সদস্য"],["savings","জমা"],["loans","ঋণ"]];
  if(isAdmin) items.push(["settings","অ্যাডমিন"]);
  return `<div class="fixed bottom-4 left-0 right-0 px-4">
    <div class="glass max-w-md mx-auto flex justify-around py-2.5">
      ${items.map(([k,l])=>`<button onclick="switchTab('${k}')" class="tab-btn ${tab===k?'active':''} px-3 py-1.5 rounded-full text-sm font-medium transition">${l}</button>`).join('')}
    </div>
  </div>`;
}

function dashView(){
  const total=savings.reduce((a,s)=>a+Number(s.amount||0),0);
  const outstanding=loans.filter(l=>l.status!=='paid').reduce((a,l)=>a+Number(l.remaining||0),0);
  return `<div class="glass p-5 mb-4">
    <div class="text-sm" style="color:var(--sub)">মোট জমা</div>
    <div class="text-3xl font-bold grad-text">৳ ${fmt(total)}</div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="glass p-3"><div class="text-xs" style="color:var(--sub)">সদস্য</div><div class="text-xl font-bold">${members.length}</div></div>
      <div class="glass p-3"><div class="text-xs" style="color:var(--sub)">বকেয়া ঋণ</div><div class="text-xl font-bold">৳ ${fmt(outstanding)}</div></div>
    </div>
    <div class="mt-3 text-xs" style="color:var(--sub)">মাসিক চাঁদা ৳${fmt(config.monthlyAmount)} • মেয়াদ ${config.termMonths} মাস</div>
  </div>
  <div class="text-sm font-semibold mb-2" style="color:var(--sub)">সাম্প্রতিক জমা</div>
  ${savings.slice(0,5).map(s=>`<div class="glass p-3 mb-2 flex justify-between items-center">
      <div><div class="font-medium">${memberName(s.memberId)}</div><div class="text-xs" style="color:var(--sub)">${s.month||''}</div></div>
      <div class="font-semibold grad-text">৳${fmt(s.amount)}</div>
    </div>`).join('') || `<div class="glass p-4 text-center text-sm" style="color:var(--sub)">এখনো কোনো জমা নেই</div>`}
  <div class="text-center text-xs italic mt-5 px-4" style="color:var(--sub)">যে ব্যক্তি অভাবগ্রস্ত ঋণগ্রহীতাকে অবকাশ দেয় বা তার ঋণ মাফ করে দেয়, কিয়ামতের দিন আল্লাহ তাকে নিজ ছায়ায় স্থান দেবেন — সহীহ মুসলিম (ভাবার্থ)</div>`;
}

function membersView(){
  return `${isAdmin?`<div class="glass p-4 mb-4">
    <div class="font-semibold mb-2">নতুন সদস্য যোগ করুন</div>
    <input id="mName" placeholder="নাম" class="mb-2">
    <input id="mPhone" placeholder="ফোন নম্বর" class="mb-3">
    <button class="btn w-full py-2.5" onclick="addMember()">যোগ করুন</button>
  </div>`:''}
  ${members.map(m=>`<div class="glass p-4 mb-2 flex justify-between items-center" style="cursor:pointer" onclick="openMemberProfile('${m.id}')">
    <div><div class="font-semibold">${m.name}</div><div class="text-xs" style="color:var(--sub)">${m.phone||''}</div></div>
    <div class="text-right">
      <div class="font-semibold grad-text">৳${fmt(memberSaved(m.id))}</div>
      ${isAdmin?`<button onclick="event.stopPropagation();delMember('${m.id}')" class="text-xs text-red-500 mt-1">মুছে ফেলুন</button>`:''}
    </div>
  </div>`).join('') || `<div class="glass p-4 text-center text-sm" style="color:var(--sub)">কোনো সদস্য নেই</div>`}`;
}

function openMemberProfile(id){ selectedMemberId=id; tab='memberProfile'; render(); }

function memberProfileView(id){
  const m=members.find(x=>x.id===id);
  if(!m) return `<div class="glass p-6 text-center">সদস্য পাওয়া যায়নি</div><button onclick="switchTab('members')" class="w-full py-2.5 rounded-xl text-sm mt-3" style="background:rgba(255,255,255,.5)">ফিরে যান</button>`;
  const mySavings=savings.filter(s=>s.memberId===id);
  const myLoans=loans.filter(l=>l.memberId===id);
  const total=memberSaved(id);
  const byYear={};
  mySavings.forEach(s=>{ const y=(s.month||s.date||'').slice(0,4)||'অজানা'; byYear[y]=(byYear[y]||0)+Number(s.amount||0); });
  const years=Object.keys(byYear).sort();
  return `<button onclick="switchTab('members')" class="text-sm mb-3" style="color:var(--sub)">← সদস্য তালিকায় ফিরুন</button>
  <div class="glass p-5 mb-4">
    <div class="text-xl font-bold grad-text">${m.name}</div>
    <div class="text-xs mt-1" style="color:var(--sub)">${m.phone||''}</div>
    <div class="mt-3 text-sm" style="color:var(--sub)">মোট জমা</div>
    <div class="text-2xl font-bold">৳${fmt(total)}</div>
  </div>
  <div class="glass p-4 mb-4">
    <div class="text-sm font-semibold mb-2" style="color:var(--sub)">মাসিক রিপোর্ট</div>
    <canvas id="memberChart" height="180"></canvas>
  </div>
  ${years.length?`<div class="glass p-4 mb-4">
    <div class="text-sm font-semibold mb-2" style="color:var(--sub)">বাৎসরিক সারসংক্ষেপ</div>
    <div class="grid grid-cols-2 gap-2">${years.map(y=>`<div class="glass p-3"><div class="text-xs" style="color:var(--sub)">${y}</div><div class="font-semibold grad-text">৳${fmt(byYear[y])}</div></div>`).join('')}</div>
  </div>`:''}
  ${myLoans.length?`<div class="text-sm font-semibold mb-2" style="color:var(--sub)">ঋণের ইতিহাস</div>
  ${myLoans.map(l=>`<div class="glass p-3 mb-2 flex justify-between items-center"><div class="text-sm">৳${fmt(l.amount)}</div><div class="text-xs" style="color:${l.status==='paid'?'#2bb787':'var(--sub)'}">${l.status==='paid'?'পরিশোধিত':'চলমান (বাকি ৳'+fmt(l.remaining)+')'}</div></div>`).join('')}</div>`:''}
  <div class="text-sm font-semibold mb-2 mt-2" style="color:var(--sub)">জমার ইতিহাস</div>
  ${mySavings.length?mySavings.map(s=>`<div class="glass p-3 mb-2 flex justify-between items-center">
      <div class="text-sm">${s.month||s.date||''}${s.amount<0?' • উত্তোলন':''}</div>
      <div class="font-semibold grad-text">৳${fmt(Math.abs(s.amount))}</div>
    </div>`).join(''):`<div class="glass p-4 text-center text-sm" style="color:var(--sub)">কোনো জমা নেই</div>`}`;
}

function renderMemberChart(id){
  const canvas=document.getElementById('memberChart');
  if(!canvas||typeof Chart==='undefined') return;
  const data=savings.filter(s=>s.memberId===id);
  const byMonth={};
  data.forEach(s=>{ const mo=s.month||(s.date||'').slice(0,7)||'অজানা'; byMonth[mo]=(byMonth[mo]||0)+Number(s.amount||0); });
  const months=Object.keys(byMonth).sort();
  const values=months.map(mo=>byMonth[mo]);
  if(memberChartInstance){ memberChartInstance.destroy(); memberChartInstance=null; }
  memberChartInstance=new Chart(canvas,{
    type:'bar',
    data:{labels:months,datasets:[{label:'মাসিক নিট জমা (৳)',data:values,backgroundColor:'#7c6cf0',borderRadius:6}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
  });
}

function savingsView(){
  const opts=members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  return `${isAdmin?`<div class="glass p-4 mb-4">
    <div class="font-semibold mb-2">জমা / উত্তোলন যুক্ত করুন</div>
    <select id="sMember" class="mb-2">${opts}</select>
    <select id="sType" class="mb-2"><option value="deposit">জমা</option><option value="withdraw">উত্তোলন (মেয়াদ শেষে)</option></select>
    <input id="sAmount" type="number" placeholder="পরিমাণ" value="${config.monthlyAmount}" class="mb-2">
    <input id="sMonth" type="month" value="${monthStr()}" class="mb-3">
    <button class="btn w-full py-2.5" onclick="addSaving()">সংরক্ষণ করুন</button>
  </div>`:''}
  ${savings.map(s=>`<div class="glass p-3 mb-2 flex justify-between items-center">
    <div><div class="font-medium">${memberName(s.memberId)}</div><div class="text-xs" style="color:var(--sub)">${s.month||''}${s.amount<0?' • উত্তোলন':''}</div></div>
    <div class="flex items-center gap-3">
      <div class="font-semibold grad-text">৳${fmt(Math.abs(s.amount))}</div>
      <button onclick="shareReceipt({type:'${s.amount<0?'উত্তোলনের রশিদ':'জমার রশিদ'}',who:'${memberName(s.memberId).replace(/'/g,"\\'")}',amount:${Math.abs(s.amount)},date:'${s.date||s.month||''}'})" class="text-xs grad-text font-medium">রশিদ</button>
      ${isAdmin?`<button onclick="delSaving('${s.id}')" class="text-xs text-red-500">✕</button>`:''}
    </div>
  </div>`).join('') || `<div class="glass p-4 text-center text-sm" style="color:var(--sub)">কোনো জমা নেই</div>`}
  <div class="text-center text-xs italic mt-5 px-4" style="color:var(--sub)">কে আছ যে আল্লাহকে উত্তম ঋণ (সঞ্চয়/দান) দেবে, যাতে তিনি তা বহুগুণ বৃদ্ধি করে দেন — সূরা আল-বাকারা, আয়াত ২৪৫ (ভাবার্থ)</div>`;
}

function loansView(){
  const opts=members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  return `${isAdmin?`<div class="glass p-4 mb-4">
    <div class="font-semibold mb-2">ঋণ প্রদান করুন</div>
    <div class="flex gap-2 mb-3">
      <button type="button" onclick="loanMode='member';render()" class="flex-1 py-2 rounded-xl text-sm font-medium" style="background:${loanMode==='member'?'var(--card-b)':'rgba(255,255,255,.4)'}">সদস্য থেকে</button>
      <button type="button" onclick="loanMode='external';render()" class="flex-1 py-2 rounded-xl text-sm font-medium" style="background:${loanMode==='external'?'var(--card-b)':'rgba(255,255,255,.4)'}">নতুন ব্যক্তি</button>
    </div>
    ${loanMode==='member'?`<select id="lMember" class="mb-2">${opts}</select>`:`<input id="lName" placeholder="নাম" class="mb-2"><input id="lPhone" placeholder="মোবাইল নম্বর" class="mb-2"><input id="lNid" placeholder="এনআইডি / জন্ম নিবন্ধন নম্বর" class="mb-2"><input id="lAddress" placeholder="ঠিকানা" class="mb-2">`}
    <input id="lAmount" type="number" placeholder="ঋণের পরিমাণ" class="mb-2">
    <input id="lDue" type="date" class="mb-3">
    <button class="btn w-full py-2.5" onclick="addLoan()">ঋণ দিন</button>
  </div>`:''}
  ${loans.map(l=>{const name=l.memberId?memberName(l.memberId):(l.name||'বহিরাগত');const phone=l.memberId?((members.find(m=>m.id===l.memberId)||{}).phone||''):(l.phone||'');const dueSoon=l.dueDate&&l.status!=='paid'&&((new Date(l.dueDate)-new Date())/86400000<=7);return `<div class="glass p-4 mb-2">
    <div class="flex justify-between items-center">
      <div><div class="font-semibold">${name}</div><div class="text-xs" style="color:var(--sub)">মেয়াদ: ${l.dueDate||'-'}${l.address?' • '+l.address:''}</div></div>
      <div class="text-right">
        <div class="font-semibold grad-text">৳${fmt(l.remaining)} <span class="text-xs" style="color:var(--sub)">/ ৳${fmt(l.amount)}</span></div>
        <div class="text-xs" style="color:${l.status==='paid'?'#2bb787':(dueSoon?'#ff5c8a':'var(--sub)')}">${l.status==='paid'?'পরিশোধিত':(dueSoon?'মেয়াদ কাছাকাছি':'চলমান')}</div>
      </div>
    </div>
    ${isAdmin&&l.status!=='paid'?`<div class="flex gap-2 mt-3">
      <input id="rp_${l.id}" type="number" placeholder="কিস্তি পরিমাণ" class="flex-1">
      <button onclick="repay('${l.id}')" class="btn px-4 py-2 text-sm">কিস্তি জমা</button>
    </div>`:''}
    <div class="flex items-center gap-3 mt-2">
      ${isAdmin&&phone&&l.status!=='paid'?`<button onclick="sendReminder('${l.id}')" class="text-xs grad-text font-medium">রিমাইন্ডার পাঠান</button>`:''}
      ${isAdmin?`<button onclick="delLoan('${l.id}')" class="text-xs text-red-500">মুছে ফেলুন</button>`:''}
    </div>
  </div>`;}).join('') || `<div class="glass p-4 text-center text-sm" style="color:var(--sub)">কোনো ঋণ নেই</div>`}
  <div class="text-center text-xs italic mt-5 px-4" style="color:var(--sub)">তোমরা যখন নির্দিষ্ট মেয়াদে ঋণের লেনদেন করবে, তা লিখে রাখবে — সূরা আল-বাকারা, আয়াত ২৮২ (ভাবার্থ)</div>`;
}

function settingsView(){
  if(!isAdmin) return `<div class="glass p-6 text-center">প্রবেশাধিকার নেই</div>`;
  return `<div class="glass p-4 mb-4">
    <div class="font-semibold mb-3">সংগঠনের সেটিংস</div>
    <label class="text-xs" style="color:var(--sub)">সংগঠনের নাম</label>
    <input id="cfgName" value="${config.orgName}" class="mb-3">
    <label class="text-xs" style="color:var(--sub)">মাসিক চাঁদার পরিমাণ (৳)</label>
    <input id="cfgAmt" type="number" value="${config.monthlyAmount}" class="mb-3">
    <label class="text-xs" style="color:var(--sub)">মেয়াদ (মাস)</label>
    <input id="cfgTerm" type="number" value="${config.termMonths}" class="mb-3">
    <button class="btn w-full py-2.5" onclick="saveConfig()">সংরক্ষণ করুন</button>
  </div>
  <button onclick="auth.signOut();isAdmin=false;switchTab('dash')" class="w-full py-2.5 rounded-xl text-sm" style="background:rgba(255,255,255,.5)">অ্যাডমিন থেকে বের হোন</button>`;
}

function render(){
  const views={dash:dashView,members:membersView,savings:savingsView,loans:loansView,settings:settingsView};
  const body = tab==='memberProfile' ? memberProfileView(selectedMemberId) : (views[tab]||dashView)();
  document.getElementById('app').innerHTML = topBar()+body+navBar();
  if(tab==='memberProfile'){ setTimeout(()=>renderMemberChart(selectedMemberId),0); }
}

function showToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(30,25,45,.92);color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;z-index:999;max-width:85%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}
async function addMember(){
  const name=document.getElementById('mName').value.trim();
  const phone=document.getElementById('mPhone').value.trim();
  if(!name||!db) return;
  try{ await db.collection('members').add({name,phone,createdAt:Date.now()}); }
  catch(e){ showToast('তোমার এই পরিবর্তন করার অনুমতি নেই।'); }
}
async function delMember(id){ if(!db) return; try{ await db.doc('members/'+id).delete(); }catch(e){ showToast('তোমার এই পরিবর্তন করার অনুমতি নেই।'); } }
async function addSaving(){
  const memberId=document.getElementById('sMember').value;
  const type=document.getElementById('sType').value;
  let amount=Number(document.getElementById('sAmount').value||0);
  const month=document.getElementById('sMonth').value||monthStr();
  if(!memberId||!amount||!db) return;
  amount = type==='withdraw' ? -Math.abs(amount) : Math.abs(amount);
  try{ await db.collection('savings').add({memberId,amount,month,type,date:todayStr(),createdAt:Date.now()}); }
  catch(e){ showToast('তোমার এই পরিবর্তন করার অনুমতি নেই।'); }
}
async function delSaving(id){ if(!db) return; try{ await db.doc('savings/'+id).delete(); }catch(e){ showToast('তোমার এই পরিবর্তন করার অনুমতি নেই।'); } }
async function addLoan(){
  const amount=Number(document.getElementById('lAmount').value||0);
  const dueDate=document.getElementById('lDue').value;
  if(!amount||!db) return;
  const base={amount,remaining:amount,dueDate,issueDate:todayStr(),status:'active',createdAt:Date.now()};
  try{
    if(loanMode==='member'){
      const memberId=document.getElementById('lMember').value;
      if(!memberId) return;
      await db.collection('loans').add({...base,memberId});
    }else{
      const name=document.getElementById('lName').value.trim();
      const phone=document.getElementById('lPhone').value.trim();
      const nid=document.getElementById('lNid').value.trim();
      const address=document.getElementById('lAddress').value.trim();
      if(!name) return;
      await db.collection('loans').add({...base,memberId:null,name,phone,nid,address});
    }
  }catch(e){ showToast('তোমার এই পরিবর্তন করার অনুমতি নেই।'); }
}
async function delLoan(id){ if(!db) return; try{ await db.doc('loans/'+id).delete(); }catch(e){ showToast('তোমার এই পরিবর্তন করার অনুমতি নেই।'); } }
function sendReminder(id){
  const l=loans.find(x=>x.id===id); if(!l) return;
  const name=l.memberId?memberName(l.memberId):(l.name||'');
  const phone=l.memberId?((members.find(m=>m.id===l.memberId)||{}).phone||''):(l.phone||'');
  if(!phone) return;
  let digits=phone.replace(/[^0-9]/g,'');
  if(digits.startsWith('0')) digits='88'+digits; else if(!digits.startsWith('880')) digits='880'+digits;
  const msg=`প্রিয় ${name}, আসসালামু আলাইকুম। ${config.orgName} থেকে অনুরোধ, আপনার ঋণের কিস্তি ৳${fmt(l.remaining)} আগামী ${l.dueDate||''} তারিখের মধ্যে পরিশোধ করার জন্য বিনীত অনুরোধ করা হলো। জাজাকাল্লাহু খাইরান।`;
  window.open(`https://wa.me/${digits}?text=${encodeURIComponent(msg)}`,'_blank');
}
async function shareReceipt(data){
  const el=document.createElement('div');
  el.style.position='fixed'; el.style.left='-9999px'; el.style.top='0'; el.style.width='380px';
  el.innerHTML=`<div style="font-family:'Hind Siliguri',sans-serif;background:linear-gradient(135deg,#eef0ff,#ffe9f5);padding:28px;border-radius:24px;">
    <div style="text-align:center;font-size:12px;color:#6b6887;margin-bottom:4px">বিসমিল্লাহির রহমানির রহিম</div>
    <div style="text-align:center;font-size:20px;font-weight:700;color:#6c4fd6;margin-bottom:14px">${config.orgName}</div>
    <div style="background:rgba(255,255,255,.7);border-radius:16px;padding:18px;">
      <div style="font-size:13px;color:#6b6887">${data.type}</div>
      <div style="font-size:22px;font-weight:700;color:#2c2a4a;margin:4px 0">৳ ${fmt(data.amount)}</div>
      <div style="font-size:14px;color:#2c2a4a;margin-top:10px">নাম: ${data.who}</div>
      <div style="font-size:13px;color:#6b6887">তারিখ: ${data.date}</div>
    </div>
    <div style="text-align:center;font-size:11px;color:#6b6887;margin-top:16px">তোমরা তোমাদের লেনদেন লিখে রাখো — সূরা আল-বাকারা, আয়াত ২৮২ (ভাবার্থ)</div>
  </div>`;
  document.body.appendChild(el);
  try{
    const canvas=await html2canvas(el.firstChild,{backgroundColor:null,scale:2});
    el.remove();
    canvas.toBlob(async(blob)=>{
      if(!blob) return;
      const file=new File([blob],'receipt.png',{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:'রশিদ'}); return; }catch(e){}
      }
      try{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download='receipt_'+Date.now()+'.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),2000);
      }catch(e){ console.error(e); }
    },'image/png');
  }catch(e){ el.remove(); console.error(e); }
}
async function repay(id){
  const inp=document.getElementById('rp_'+id);
  const amt=Number(inp.value||0);
  const loan=loans.find(l=>l.id===id);
  if(!amt||!loan||!db) return;
  const remaining=Math.max(0,Number(loan.remaining)-amt);
  try{ await db.doc('loans/'+id).update({remaining, status: remaining<=0?'paid':'active'}); }
  catch(e){ showToast('তোমার এই পরিবর্তন করার অনুমতি নেই।'); }
}
async function saveConfig(){
  const orgName=document.getElementById('cfgName').value.trim()||config.orgName;
  const monthlyAmount=Number(document.getElementById('cfgAmt').value||config.monthlyAmount);
  const termMonths=Number(document.getElementById('cfgTerm').value||config.termMonths);
  if(!db) return;
  try{ await db.doc('app/config').set({orgName,monthlyAmount,termMonths}); }
  catch(e){ showToast('তোমার এই পরিবর্তন করার অনুমতি নেই।'); }
}

function sortRecent(arr){ return [...arr].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); }

function init(){
  render();
  auth.onAuthStateChanged(u=>{
    isAdmin = !!u;
    render();
  });
  db.collection('members').onSnapshot(snap=>{
    members = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
  db.collection('savings').onSnapshot(snap=>{
    savings = sortRecent(snap.docs.map(d=>({id:d.id,...d.data()})));
    render();
  });
  db.collection('loans').onSnapshot(snap=>{
    loans = sortRecent(snap.docs.map(d=>({id:d.id,...d.data()})));
    render();
  });
  db.doc('app/config').onSnapshot(snap=>{
    if(snap.exists) config = {...config, ...snap.data()};
    render();
  });
}
init();
</script>
</body>
</html>
